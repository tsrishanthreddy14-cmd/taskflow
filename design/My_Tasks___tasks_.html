            <select id="form-priority" class="w-full px-3.5 py-2 rounded bg-light-surface-container-lowest dark:bg-dark-surface-container border border-light-outline-variant dark:border-dark-outline-variant text-body-md">
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
          </label>
          <label class="flex flex-col gap-1.5">
            <span data-design-text-token="label-md" class="font-label text-label-md">Category</span>
            <select id="form-category" class="w-full px-3.5 py-2 rounded bg-light-surface-container-lowest dark:bg-dark-surface-container border border-light-outline-variant dark:border-dark-outline-variant text-body-md">
              <option value="Work">Work</option>
              <option value="Design">Design</option>
              <option value="Engineering">Engineering</option>
              <option value="Personal">Personal</option>
            </select>
          </label>
        </div>
        <label class="flex flex-col gap-1.5">
          <span data-design-text-token="label-md" class="font-label text-label-md">Tags (comma separated)</span>
          <input id="form-tags" type="text" placeholder="e.g., ui, q4, review" class="w-full px-3.5 py-2 rounded bg-light-surface-container-lowest dark:bg-dark-surface-container border border-light-outline-variant dark:border-dark-outline-variant text-body-md">
        </label>
      </div>
      <footer class="flex items-center justify-end gap-gutter-sm px-gutter-lg py-gutter-md border-t border-light-outline-variant dark:border-dark-outline-variant bg-light-surface-container-low dark:bg-dark-surface-container">
        <button type="button" onclick="document.getElementById(&#39;task-modal&#39;).close()" class="px-4 py-2 rounded border border-light-outline-variant dark:border-dark-outline-variant font-label text-label-lg">
          <span data-design-text-token="label-lg">Cancel</span>
        </button>
        <button type="submit" class="px-4 py-2 rounded bg-light-primary dark:bg-dark-primary text-light-on-primary dark:text-dark-on-primary font-label text-label-lg">
          <span data-design-text-token="label-lg">Save Task</span>
        </button>
      </footer>
    </form>
  </dialog>

  <dialog id="mobile-nav-drawer" data-component-id="modal-drawer" data-component-type="modal" data-component-variant="drawer" aria-labelledby="mobile-nav-title" class="m-0 h-full max-h-none w-72 bg-light-surface-container-lowest dark:bg-dark-surface-container-low text-light-on-surface dark:text-dark-on-surface border-r border-light-outline-variant dark:border-dark-outline-variant p-0 backdrop:bg-black/40">
    <header class="h-16 px-gutter-lg flex items-center justify-between border-b border-light-outline-variant dark:border-dark-outline-variant">
      <h2 id="mobile-nav-title" class="font-headline text-headline-md" data-design-text-token="headline-md">TaskFlow</h2>
      <button type="button" onclick="document.getElementById(&#39;mobile-nav-drawer&#39;).close()" aria-label="Close navigation menu" class="inline-flex items-center justify-center w-8 h-8 rounded">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </header>
    <nav class="p-3 flex flex-col gap-1">
      <a href="../dashboard/Dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded text-light-on-surface-variant dark:text-dark-on-surface-variant font-label text-label-lg">Dashboard</a>
      <a href="../tasks/MyTasks.html" class="flex items-center gap-3 px-3 py-2.5 rounded bg-light-primary dark:bg-dark-primary text-light-on-primary dark:text-dark-on-primary font-label text-label-lg">My Tasks</a>
      <a href="../calendar/Calendar.html" class="flex items-center gap-3 px-3 py-2.5 rounded text-light-on-surface-variant dark:text-dark-on-surface-variant font-label text-label-lg">Calendar</a>
      <a href="../analytics/Analytics.html" class="flex items-center gap-3 px-3 py-2.5 rounded text-light-on-surface-variant dark:text-dark-on-surface-variant font-label text-label-lg">Analytics</a>
      <a href="../settings/Settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded text-light-on-surface-variant dark:text-dark-on-surface-variant font-label text-label-lg">Settings</a>
    </nav>
  </dialog>

  <script>
    const DEFAULT_TASKS = [
      { id: 1, title: "Design system token audit", description: "Verify contrast ratios and update button tokens across light and dark surfaces.", category: "Design", tags: ["tokens", "ui"], priority: "High", dueDate: "2026-11-25", dueTime: "09:30 AM", completed: false },
      { id: 2, title: "Finalize Q4 product roadmap", description: "Align engineering milestones and design review dates for December release.", category: "Work", tags: ["planning", "q4"], priority: "High", dueDate: "2026-11-25", dueTime: "04:30 PM", completed: false },
      { id: 3, title: "Sprint 14 API integration sync", description: "Review REST endpoints for task filtering and MongoDB pagination.", category: "Engineering", tags: ["api", "sync"], priority: "Medium", dueDate: "2026-11-25", dueTime: "01:00 PM", completed: true },
      { id: 4, title: "Submit quarterly tax estimates", description: "Upload Q4 invoices and confirm payment receipt.", category: "Personal", tags: ["finance"], priority: "High", dueDate: "2026-11-23", dueTime: "05:00 PM", completed: false },
      { id: 5, title: "Refactor MongoDB task schema", description: "Add compound index on userId and dueDate for calendar queries.", category: "Engineering", tags: ["database"], priority: "Medium", dueDate: "2026-11-24", dueTime: "03:00 PM", completed: false },
      { id: 6, title: "Prepare user interview script", description: "Draft 8 usability questions for TaskFlow calendar interactions.", category: "Design", tags: ["research"], priority: "Low", dueDate: "2026-11-27", dueTime: "11:00 AM", completed: false },
      { id: 7, title: "Publish November changelog", description: "Summarize dark mode and analytics improvements for customers.", category: "Work", tags: ["release"], priority: "Medium", dueDate: "2026-11-28", dueTime: "02:00 PM", completed: true }
    ];

    function loadTasks() {
      try {
        const saved = localStorage.getItem("taskflow_tasks");
        return saved ? JSON.parse(saved) : DEFAULT_TASKS;
      } catch (e) { return DEFAULT_TASKS; }
    }
    function saveTasks(list) {
      try { localStorage.setItem("taskflow_tasks", JSON.stringify(list)); } catch (e) {}
    }
    let tasks = loadTasks();

    const priorityRank = { High: 1, Medium: 2, Low: 3 };

    function priorityBadge(priority) {
      if (priority === "High") return '<span class="px-2.5 py-0.5 rounded-full bg-light-error-container dark:bg-dark-error-container text-light-on-error-container dark:text-dark-on-error-container font-label text-label-md">High</span>';
      if (priority === "Medium") return '<span class="px-2.5 py-0.5 rounded-full bg-light-surface-container-high dark:bg-dark-surface-container-high text-light-tertiary dark:text-dark-tertiary font-label text-label-md">Medium</span>';
      return '<span class="px-2.5 py-0.5 rounded-full bg-light-secondary-container dark:bg-dark-secondary-container text-light-on-secondary-container dark:text-dark-on-secondary-container font-label text-label-md">Low</span>';
    }

    function taskCardHTML(t) {
      const tagsHtml = (t.tags || []).map(tag => `<span class="px-2 py-0.5 rounded bg-light-surface-container dark:bg-dark-surface-container text-light-on-surface-variant dark:text-dark-on-surface-variant font-mono text-mono-sm">#${tag}</span>`).join("");
      return `
        <article class="bg-light-surface-container-lowest dark:bg-dark-surface-container-low border border-light-outline-variant dark:border-dark-outline-variant rounded-md p-gutter-md flex flex-col sm:flex-row sm:items-center justify-between gap-gutter-md">
          <div class="flex items-start gap-3 min-w-0">
            <input type="checkbox" ${t.completed ? "checked" : ""} onchange="toggleComplete(${t.id})" aria-label="Mark ${t.title} completed" class="mt-1 w-4 h-4 rounded border-light-outline dark:border-dark-outline text-light-primary dark:text-dark-primary">
            <div class="min-w-0 flex flex-col gap-1">
              <div class="flex flex-wrap items-center gap-2">
                <h3 class="font-title text-title-md ${t.completed ? "line-through text-light-outline dark:text-dark-outline" : "text-light-on-surface dark:text-dark-on-surface"}" data-design-text-token="title-md">${t.title}</h3>
                ${priorityBadge(t.priority)}
                <span class="px-2.5 py-0.5 rounded-full bg-light-surface-container dark:bg-dark-surface-container text-light-on-surface-variant dark:text-dark-on-surface-variant font-label text-label-md">${t.category}</span>
              </div>
              <p class="font-body text-body-md text-light-on-surface-variant dark:text-dark-on-surface-variant" data-design-text-token="body-md">${t.description || "No description provided."}</p>
              <div class="flex flex-wrap items-center gap-2 pt-1">
                <span class="font-mono text-mono-sm text-light-on-surface-variant dark:text-dark-on-surface-variant tabular-nums" data-design-text-token="mono-sm">${t.dueDate} • ${t.dueTime || "05:00 PM"}</span>
                ${tagsHtml}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <button type="button" onclick="openTaskModal(${t.id})" aria-label="Edit task" class="inline-flex items-center gap-1 px-3 py-1.5 rounded border border-light-outline-variant dark:border-dark-outline-variant text-light-on-surface dark:text-dark-on-surface hover:bg-light-surface-container-low dark:hover:bg-dark-surface-container font-label text-label-md">
              <span class="material-symbols-outlined text-[16px]">edit</span>
              <span data-design-text-token="label-md">Edit</span>
            </button>
            <button type="button" onclick="deleteTask(${t.id})" aria-label="Delete task" class="inline-flex items-center justify-center w-8 h-8 rounded text-light-error dark:text-dark-error hover:bg-light-error-container dark:hover:bg-dark-error-container">
              <span class="material-symbols-outlined text-[18px]">delete</span>
            </button>
          </div>
        </article>
      `;
    }

    function renderTasks() {
      const q = document.getElementById("search-input").value.toLowerCase();
      const prio = document.getElementById("filter-priority").value;
      const cat = document.getElementById("filter-category").value;
      const status = document.getElementById("filter-status").value;
      const sort = document.getElementById("sort-by").value;

      let filtered = tasks.filter(t => {
        const matchQ = !q || t.title.toLowerCase().includes(q) || (t.description || "").toLowerCase().includes(q) || (t.tags || []).some(tg => tg.toLowerCase().includes(q));
        const matchP = prio === "All" || t.priority === prio;
        const matchC = cat === "All" || t.category === cat;
        const matchS = status === "All" || (status === "Pending" ? !t.completed : t.completed);
        return matchQ && matchP && matchC && matchS;
      });

      filtered.sort((a, b) => sort === "priority" ? priorityRank[a.priority] - priorityRank[b.priority] : a.dueDate.localeCompare(b.dueDate));

      const pending = filtered.filter(t => !t.completed);
      const completed = filtered.filter(t => t.completed);

      document.getElementById("pending-count").textContent = pending.length;
      document.getElementById("completed-count").textContent = completed.length;

      document.getElementById("pending-list").innerHTML = pending.length ? pending.map(taskCardHTML).join("") : '<p class="p-6 rounded-md bg-light-surface-container-low dark:bg-dark-surface-container text-body-md text-light-on-surface-variant dark:text-dark-on-surface-variant">No pending tasks match your filters.</p>';
      document.getElementById("completed-list").innerHTML = completed.length ? completed.map(taskCardHTML).join("") : '<p class="p-6 rounded-md bg-light-surface-container-low dark:bg-dark-surface-container text-body-md text-light-on-surface-variant dark:text-dark-on-surface-variant">No completed tasks yet.</p>';
    }

    function toggleComplete(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveTasks(tasks);
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks(tasks);
      renderTasks();
    }

    function openTaskModal(id) {
      const modal = document.getElementById("task-modal");
      if (id) {
        const t = tasks.find(x => x.id === id);
        document.getElementById("task-modal-title").textContent = "Edit Task";
        document.getElementById("edit-task-id").value = t.id;
        document.getElementById("form-title").value = t.title;
        document.getElementById("form-desc").value = t.description || "";
        document.getElementById("form-date").value = t.dueDate;
        document.getElementById("form-time").value = t.dueTime || "04:00 PM";
        document.getElementById("form-priority").value = t.priority;
        document.getElementById("form-category").value = t.category;
        document.getElementById("form-tags").value = (t.tags || []).join(", ");
      } else {
        document.getElementById("task-modal-title").textContent = "Add New Task";
        document.getElementById("task-form").reset();
        document.getElementById("edit-task-id").value = "";
        document.getElementById("form-date").value = "2026-11-26";
      }
      modal.showModal();
    }

    function saveTaskForm(e) {
      e.preventDefault();
      const id = document.getElementById("edit-task-id").value;
      const payload = {
        title: document.getElementById("form-title").value.trim(),
        description: document.getElementById("form-desc").value.trim(),
        dueDate: document.getElementById("form-date").value,
        dueTime: document.getElementById("form-time").value.trim() || "05:00 PM",
        priority: document.getElementById("form-priority").value,
        category: document.getElementById("form-category").value,
        tags: document.getElementById("form-tags").value.split(",").map(s => s.trim()).filter(Boolean)
      };
      if (id) {
        tasks = tasks.map(t => t.id === Number(id) ? { ...t, ...payload } : t);
      } else {
        tasks.unshift({ id: Date.now(), ...payload, completed: false });
      }
      saveTasks(tasks);
      document.getElementById("task-modal").close();
      renderTasks();
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle("dark");
      document.getElementById("theme-icon").textContent = isDark ? "light_mode" : "dark_mode";
      try { localStorage.setItem("taskflow_theme", isDark ? "dark" : "light"); } catch (e) {}
    }

    try {
      if (localStorage.getItem("taskflow_theme") === "dark") {
        document.documentElement.classList.add("dark");
        document.getElementById("theme-icon").textContent = "light_mode";
      }
    } catch (e) {}

    renderTasks();
  </script>


</body></html>
